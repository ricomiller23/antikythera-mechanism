<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>The Antikythera Mechanism — Working 3D Kinematic Model & Ancient Cosmos</title>
  <link rel="stylesheet" href="./src/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bronze: '#c89658',
            verdigris: '#489080'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
  <div id="app">
    <!-- 3D WEBGL MODEL (LEFT ~60%) -->
    <div id="canvas-container">
      <!-- Overlay Instructions for User -->
      <div class="absolute top-3 left-3 pointer-events-none z-10 flex flex-col gap-1 text-[11px] font-mono text-slate-400 bg-slate-950/75 p-2.5 rounded-lg border border-slate-800/80 backdrop-blur-sm shadow-lg">
        <div class="text-amber-400 font-bold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          PHYSICAL KINEMATIC SIMULATION (60 FPS)
        </div>
        <div>Drag: 3D Rotate / Orbit</div>
        <div>Scroll / Pinch: Zoom In & Out</div>
        <div>Right Click / 2-Finger: Pan</div>
        <div>Click Gear: Inspect Provenance</div>
      </div>

      <!-- Viewport Floating Controls: Zoom & Viewport Framing -->
      <div class="absolute top-3 right-3 z-10 flex items-center gap-1.5 bg-slate-950/80 p-1.5 rounded-lg border border-slate-800/80 backdrop-blur-sm shadow-xl">
        <button id="btn-zoom-in" class="w-8 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-lg active:scale-95 transition-transform" title="Zoom In" aria-label="Zoom In">+</button>
        <button id="btn-zoom-out" class="w-8 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-lg active:scale-95 transition-transform" title="Zoom Out" aria-label="Zoom Out">−</button>
        <button id="btn-fit-frame" class="px-2.5 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-mono font-semibold active:scale-95 transition-transform" title="Fit Nicely in Frame" aria-label="Fit Nicely in Frame">Fit Frame</button>
        <div class="w-px h-5 bg-slate-800 mx-0.5"></div>
        <button id="btn-hud-front" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono active:scale-95 transition-transform" title="Front Dial View">Front</button>
        <button id="btn-hud-back" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono active:scale-95 transition-transform" title="Back Dial View">Back</button>
        <button id="btn-hud-gears" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono active:scale-95 transition-transform" title="Internal Gear Stack">Gears</button>
      </div>
    </div>

    <!-- CONTROLS & ASTRONOMICAL LAB (RIGHT ~40%) -->
    <div id="dashboard-container"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
